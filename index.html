<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-sub: #8b949e;
      --accent-green: #238636;
      --link: #58a6ff;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .btn-primary {
      background-color: var(--accent-green);
      color: #ffffff;
      border: 1px solid rgba(240,246,252,0.1);
      border-radius: 6px;
      padding: 6px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, SF Pro Mono, Menlo, monospace;
      background-color: rgba(110,118,129,0.4);
      padding: 0.2em 0.4em;
      border-radius: 6px;
      font-size: 85%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Hello World</h2>
      <p><code>github-style</code> のかっこいいWebサイトへようこそ！</p>
      <button class="btn-primary">Get Started</button>
    </div>
  </div>
</body>
</html>
