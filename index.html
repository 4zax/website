<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azax's Website</title>
  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --cyan: #00ffff;
      --red: #ff0000;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
    }

    /* タイトル設定 */
    .title {
      font-size: 2rem;
      font-weight: bold;
      color: var(--cyan); /* 水色（原色） */
      margin: 0 0 24px 0;
    }

    .title .quote {
      color: var(--red); /* 赤色（原色） */
    }

    /* 仕切り線 */
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* メッセージ領域 */
    .message {
      margin: 0;
    }

    /* SNS リンク一覧 */
    .social-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .social-links li {
      margin-bottom: 8px;
    }

    .social-links a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: bold;
    }

    .social-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Azax<span class="quote">'</span>s Website</h1>

    <hr>

    <p class="message">
      うわーーーーAzaxですこんにちはなにみてるの<br>
      好きなことをしています<br>
      おーまいがー
    </p>
