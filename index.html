<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azax's Website</title>
  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --cyan: #00ffff;
      --red: #ff0000;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--cyan);
      margin: 0 0 32px 0;
    }

    .title .quote {
      color: var(--red);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .message {
      margin: 0;
    }

    .social-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .social-links li {
      margin-bottom: 8px;
    }

    .social-links a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: bold;
    }

    .social-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Azax<span class="quote">'</span>s Website</h1>

    <hr size= "3" noshade>
    <p>Azaxさんは何をされている方なの？</p>
    <hr size= "3" noshade>
  
    </br>
    <p class="message">
      うわー<br>
      好きなことをしています<br>
      おうまいがー
    </p>
    </br>
    
    <hr size= "3" noshade>
    <p>このサイトは何をされているものなの？</p>
    <hr size= "3" noshade>

    </br>
    <p class="message">
      しりません<br>
      ははは
    </p>
    </br>

    <ul class="social-links">
      <li>Github : <a href="https://github.com/4zax" target="_blank" rel="noopener noreferrer">@4zax</a></li>
      <li>Youtube : <a href="https://www.youtube.com/@Azax6" target="_blank" rel="noopener noreferrer">@Azax6</a></li>
      <li>Twitter(X) : <a href="https://x.com/4zax0" target="_blank" rel="noopener noreferrer">@4zax0</a></li>
    </ul>

    <hr>
  </div>

</body>
</html>
