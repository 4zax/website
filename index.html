<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Azax's Website</title>
  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --cyan: #00ffff;
      --red: #ff0000;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--cyan);
      margin: 0 0 32px 0;
    }

    .title .quote {
      color: var(--red);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .message {
      margin: 0;
    }

    .social-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .social-links li {
      margin-bottom: 8px;
    }

    .social-links a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: bold;
    }

    .social-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Azax<span class="quote">'</span>s Website</h1>

    <hr size= "5" noshade>
    
    <ul class="social-links">
    <li><i class="fa-brands fa-github"></i>GitHub: <a href="https://github.com/4zax" target="_blank" rel="noopener noreferrer">@4zax</a></li>
    <li><i class="fa-brands fa-youtube"></i>YouTube: <a href="https://www.youtube.com/@Azax6" target="_blank" rel="noopener noreferrer">@Azax6</a></li>
    <li><i class="fa-brands fa-x-twitter"></i>X(Twitter): <a href="https://x.com/4zax0" target="_blank" rel="noopener noreferrer">@4zax0</a></li>
    </ul>
    <hr size= "5" noshade>
    
  </div>

</body>
</html>
