<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>History - Azax's Website</title>

  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --cyan: #00ffff;
      --red: #ff0000;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--cyan);
      margin: 0 0 16px 0;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .category-section {
      margin-bottom: 32px;
    }

    .category-title {
      font-size: 1.4rem;
      color: var(--cyan);
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .history-card {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-default);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .history-card:hover {
      transform: translateY(-2px);
      border-color: var(--cyan);
      box-shadow: 0 4px 12px rgba(0, 255, 255, 0.15);
    }

    .card-image-wrapper {
      width: 100%;
      height: 180px;
      background-color: #21262d;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    .card-image-placeholder {
      color: var(--text-muted);
      font-size: 2rem;
    }


    .card-content {
      padding: 20px;
    }

    .card-date {
      font-size: 0.85rem;
      color: var(--cyan);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffffff;
      margin: 0 0 6px 0;
    }

    .card-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0;
    }

    @media (min-width: 520px) {
      .history-card {
        flex-direction: row;
      }
      .card-image-wrapper {
        width: 200px;
        height: auto;
        min-height: 140px;
        flex-shrink: 0;
      }
    }

    .menu-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-subtle);
      color: var(--text-main);
      cursor: pointer;
      font-size: 22px;
    }

    .menu-button:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 999;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(300px, 80vw);
      height: 100vh;
      box-sizing: border-box;
      padding: 90px 24px 24px;
      background: var(--bg-subtle);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1000;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-title {
      color: var(--cyan);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .menu a {
      display: block;
      padding: 12px 10px;
      margin-bottom: 6px;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
    }

    .menu a:hover {
      color: var(--cyan);
      background: var(--bg-default);
    }
  </style>
</head>

<body>

  <button class="menu-button" id="menuButton" aria-label="メニューを開く" aria-expanded="false">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="menu" id="menu" aria-label="サイトメニュー">
    <div class="menu-title">Menu</div>

    <a href="/">
      <i class="fa-solid fa-house"></i> HOME
    </a>

    <a href="/friends">
      <i class="fa-solid fa-face-smile"></i> Friends
    </a>

    <a href="/history">
      <i class="fa-solid fa-clock-rotate-left"></i> <b>History</b>
    </a>
  </nav>

  <div class="container">
    <h1 class="title">History</h1>

    <hr>
    <section class="category-section">
      <h2 class="category-title">
        <i class="fa-solid fa-server"></i> Minecraft Servers
      </h2>

      <div class="history-list">
        

        <a href="https://www.4zax.jp/history/economy_survival" class="history-card">
          <div class="card-image-wrapper">

            <div class="card-image-placeholder">
              <img src="economy_survival.png" alt="Azaxerver 経済サバイバル鯖" class="card-image">
            </div>
          </div>
          
          <div class="card-content">
            <div class="card-date">
              <i class="fa-regular fa-calendar-days"></i> 2026/07/06 ~ 2026/09/23
            </div>
            <h3 class="card-title">Azaxerver 経済サバイバル鯖</h3>
            <p class="card-subtitle">1.21.11 Paperサーバー</p>
          </div>
        </a>

      </div>
    </section>


  </div>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const menuOverlay = document.getElementById("menuOverlay");

    function setMenu(open) {
      menu.classList.toggle("open", open);
      menuOverlay.classList.toggle("open", open);
      menuButton.setAttribute("aria-expanded", open);
      menuButton.innerHTML = open
        ? '<i class="fa-solid fa-xmark"></i>'
        : '<i class="fa-solid fa-bars"></i>';
    }

    menuButton.addEventListener("click", () => {
      setMenu(!menu.classList.contains("open"));
    });

    menuOverlay.addEventListener("click", () => setMenu(false));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setMenu(false);
    });
  </script>

</body>
</html>
