<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Azax's Website</title>
  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --cyan: #00ffff;
      --red: #ff0000;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--cyan);
      margin: 0 0 32px 0;
    }

    .title .quote {
      color: var(--red);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .message {
      margin: 0;
    }

    .social-links {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .social-links li {
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .social-links a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: bold;
    }

    .social-links a:hover {
      text-decoration: underline;
    }

    .friends-section-title {
      font-size: 1.2rem;
      color: var(--cyan);
      margin-bottom: 16px;
    }

    /* --- 追加・修正箇所: friend-card の枠線およびレイアウト --- */
    .friend-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
      background-color: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    /* 背景画像（スキンヘッド）の擬似要素ルール */
    .friend-card::before {
      content: "";
      position: absolute;
      top: -10px;
      right: -10px;
      width: 120px;
      height: 120px;
      background-image: var(--head-img);
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.5;
      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 1) 100%);
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 1) 100%);
      pointer-events: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      z-index: 0;
    }

    .friend-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      flex-shrink: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: relative;
      z-index: 1;
    }

    .friend-info {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .friend-name {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }

    .friend-message {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .friend-id {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      font-family: "Consolas", "Courier New", "Fira Code", monospace;
      letter-spacing: 0.25px;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }
  
    /* --- Page menu --- */
    .menu-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-subtle);
      color: var(--text-main);
      cursor: pointer;
      font-size: 22px;
    }

    .menu-button:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 999;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(300px, 80vw);
      height: 100vh;
      box-sizing: border-box;
      padding: 90px 24px 24px;
      background: var(--bg-subtle);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1000;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-title {
      color: var(--cyan);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .menu a {
      display: block;
      padding: 12px 10px;
      margin-bottom: 6px;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
    }

    .menu a:hover {
      color: var(--cyan);
      background: var(--bg-default);
    }

  </style>
</head>
<body>

  <button class="menu-button" id="menuButton" aria-label="メニューを開く" aria-expanded="false">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="menu" id="menu" aria-label="サイトメニュー">
    <div class="menu-title">Menu</div>
    <a href="/">ホーム</a>
    <a href="/friends">なかま</a>
    <a href="/history">History</a>
  </nav>

  <div class="container">
    <h1 class="title">History</h1>
    <hr size="5" noshade>
    <p class="message">ここにこれからHistoryの内容を追加していきます。</p>
  </div>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const menuOverlay = document.getElementById("menuOverlay");

    function setMenu(open) {
      menu.classList.toggle("open", open);
      menuOverlay.classList.toggle("open", open);
      menuButton.setAttribute("aria-expanded", open);
      menuButton.innerHTML = open
        ? '<i class="fa-solid fa-xmark"></i>'
        : '<i class="fa-solid fa-bars"></i>';
    }

    menuButton.addEventListener("click", () => {
      setMenu(!menu.classList.contains("open"));
    });

    menuOverlay.addEventListener("click", () => setMenu(false));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setMenu(false);
    });
  </script>

</body>
</html>
