<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title id="pageTitle">Azaxerver 経済サバイバル鯖</title>

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-sub: #8b949e;
      --cyan: #00ffff;
      --accent-green: #2ea043;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.8;
    }

    .header-nav {
      position: sticky;
      top: 0;
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .back-btn {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--cyan);
    }

    .menu-button {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-subtle);
      color: var(--text-main);
      cursor: pointer;
      font-size: 18px;
    }

    .menu-button:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .article-container {
      max-width: 680px;
      margin: 40px auto 80px;
      padding: 0 20px;
    }

    .article-header {
      margin-bottom: 32px;
    }

    .category-badge {
      display: inline-block;
      color: var(--cyan);
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .article-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 12px 0;
      line-height: 1.3;
    }

    .article-subtitle {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin: 0 0 20px 0;
    }

    .eyecatch-wrapper {
      margin: 0 0 40px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .eyecatch-image {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      display: block;
    }

    .article-body {
      font-size: 1.05rem;
      color: var(--text-main);
    }

    .article-body h2 {
      font-size: 1.5rem;
      color: #ffffff;
      margin: 40px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .article-body h3 {
      font-size: 1.25rem;
      color: #ffffff;
      margin: 28px 0 12px 0;
    }

    .article-body p {
      margin-bottom: 24px;
    }

    .article-body img {
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin: 16px 0 24px;
    }

    .article-body blockquote {
      margin: 24px 0;
      padding: 16px 20px;
      background: var(--bg-subtle);
      border-left: 4px solid var(--cyan);
      color: var(--text-sub);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 999;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(300px, 80vw);
      height: 100vh;
      box-sizing: border-box;
      padding: 90px 24px 24px;
      background: var(--bg-subtle);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1000;
    }

    .menu.open { transform: translateX(0); }
    .menu-overlay.open { opacity: 1; visibility: visible; }
    .menu-title { color: var(--cyan); font-size: 1.1rem; font-weight: bold; margin-bottom: 20px; }
    .menu a { display: block; padding: 12px 10px; margin-bottom: 6px; color: var(--text-main); text-decoration: none; border-radius: 6px; }
    .menu a:hover { color: var(--cyan); background: var(--bg-main); }

    .toggle-container {
      position: relative;
      margin: 20px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: var(--bg-subtle);
      overflow: hidden;
      z-index: 1;
    }

    .toggle-container.has-bg::before {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background-image: var(--bg-image-url);
      background-size: cover;
      background-position: top right;
      background-attachment: local;
      pointer-events: none;
      z-index: -1;

      -webkit-mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 100%);
      mask-image: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 1) 100%);
    }

    .toggle-header {
      position: relative;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .toggle-header::-webkit-details-marker {
      display: none;
    }

    .toggle-header:hover {
      color: var(--cyan);
    }

    .toggle-header::after {
      content: "\f078";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 0.9rem;
      color: var(--cyan);
      transition: transform 0.25s ease;
    }

    .toggle-container[open] .toggle-header::after {
      transform: rotate(180deg);
    }

    .toggle-content {
      position: relative;
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border);
      color: var(--text-main);
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <header class="header-nav">
    <a href="/history" class="back-link">
      <i class="fa-solid fa-chevron-left"></i> <b>History</b>b
    </a>
    <button class="menu-button" id="menuButton" aria-label="メニューを開く" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="menu" id="menu" aria-label="サイトメニュー">
    <div class="menu-title">Menu</div>
    <a href="/"><i class="fa-solid fa-house"></i> HOME</a>
    <a href="/friends"><i class="fa-solid fa-face-smile"></i> Friends</a>
    <a href="/history"><i class="fa-solid fa-clock-rotate-left"></i> History</a>
  </nav>

  <main class="article-container">
    <header class="article-header">
      <span class="category-badge" id="category">Minecraft Servers</span>
      <h1 class="article-title" id="title">Azaxerver 経済サバイバル鯖</h1>
      <p class="article-subtitle" id="subtitle">1.21.11 Paperサーバー</p>
      
      <div class="author-meta">
        <img src="" id="authorAvatar" class="author-avatar" alt="Author">
        <div class="author-info">
          <span class="author-name" id="authorName">Azax</span>
          <span class="article-date" id="date">2026/07/06 ~ 2026/09/23</span>
        </div>
      </div>
    </header>

    <div class="eyecatch-wrapper" id="eyecatchWrapper">
      <img src="" id="eyecatchImage" class="eyecatch-image" alt="アイキャッチ">
    </div>

    <article class="article-body" id="bodyContent">
    </article>
  </main>

  <script>
    const CONFIG = {
      category: "Minecraft Servers",
      title: "Azaxerver 経済サバイバル鯖",
      subtitle: "1.21.11 Paperサーバー",
      date: "2026/07/06 ~ 2026/09/23",
      eyecatchImage: "economy_survival.png",
      bodyHtml: `
        <h2>サーバー概要</h2>
        <p>
          経済システムを追加したサバイバルサーバー！<br>
          プレイヤー間の出品,注文機能を駆使してお金持ちになるのが目標です。
        </p>

        <h2>ワールド振り返り / 裏話</h2>
        <h3>ロビー</h3>
        
        <img src="lobby.png" alt="ロビー">
        <p>
          ロビーには"/lobby"でアクセスでき、<br>
          オーバーワールド、ネザー、エンドへのポータルを設けました！<br>
          <br>
          このロビーは、マイクラ側ではオーバーワールド判定で、<br>
          実際にサバイバルをしていたワールドは、プラグインで追加したディメンションでした。<br>
          <br>
          これのせいでディメンション間の移動に関わる進捗が出来なかったのは誠にごめんなさい<br>
          なのでそのかわりとしてロビーにいろんなオリジナル進捗を追加していました。<br>
        </p>
        
        <img src="mannequin.png" alt="マネキン">
        <p>
          ロビーの各所にいる、ホワイトリストに入っている全プレイヤーのマネキンを<br>
          左クリックして進捗を達成できるようにしていました。<br>
          <br>
          みんなが楽しくロビー探索やをしていてうれしかったです(小並感)<br>
          すべてのマネキンを見つけることはできましたか？<br>
        </p>

        <p>
          銅,鉄,金,ダイヤのアスレチックを作成していました！<br>
          それぞれゴールすると進捗を達成できましたね。<br>
          基本的に、大半の進捗名はAzaxに関連するものを参考に命名していました。<br>
        </p>

        <img src="athletic_copper.png" alt="アスレチック銅">
        <p>
          "Easy Obby"はRobloxから。<br>
          (Obbyはアスレチックとかパルクールみたいな意味)
        </p>

        <img src="athletic_iron.png" alt="アスレチック鉄">
        <p>
          "! RUN !"はEscape the Backroomsから。<br>
          (Level !)
        </p>

        <img src="athletic_gold.png" alt="アスレチック金">
        <p>
          "PixelRUN 3D"はPixelGUN 3Dを文字ったものから。
        </p>

        <img src="athletic_diamond.png" alt="アスレチックダイヤ">
        <p>
          "山頂 SEVEN日目"はPEAKから。<br>
          (ゴール地点到達時の日本語訳の誤植。今は7日目になっている)<br>
          <br>
          アスレチックにはタイムアタック機能を実装していましたね。<br>
          意外とタイムアタックが白熱しててめっちゃよかった、まじでよかったこれ<br>
        </p>

        <details class="toggle-container has-bg" style="--bg-image-url: url('athletic_copper_bg.png');">
          <summary class="toggle-header">タイムアタック記録 [銅]</summary>
          <div class="toggle-content">
            <p>
              <b>[#1]</b> n73e > 00:12:833<br>
              <b>[#2]</b> 4zax > 00:12:839<br>
              <b>[#3]</b> Carubi_204483 > 00:13:066<br>
              <b>[#4]</b> koutyan35 > 00:13:237<br>
              <b>[#5]</b> SabakanmelmPC > 00:13:563<br>
              <b>[#6]</b> BE_haku6345 > 00:13:732<br>
              <b>[#7]</b> Neko_1201 > 00:13:947<br>
              <b>[#7]</b> rakotoyukkuri0 > 00:14:114<br>
              <b>[#7]</b> saon777 > 00:14:355
            </p>
          </div>
        </details>

        <details class="toggle-container has-bg" style="--bg-image-url: url('athletic_iron_bg.png');">
          <summary class="toggle-header">タイムアタック記録 [鉄]</summary>
          <div class="toggle-content">
            <p>
              <b>[#1]</b> n73e > 00:13:574<br>
              <b>[#2]</b> rakotoyukkuri0 > 00:13:698<br>
              <b>[#3]</b> SabakanmelmPC > 00:14:532<br>
              <b>[#4]</b> 4zax > 00:15:777
            </p>
          </div>
        </details>

        <details class="toggle-container has-bg" style="--bg-image-url: url('athletic_gold_bg.png');">
          <summary class="toggle-header">タイムアタック記録 [金]</summary>
          <div class="toggle-content">
            <p>
              <b>[#1]</b> n73e > 00:19:717<br>
              <b>[#2]</b> SabakanmelmPC > 00:22:942<br>
              <b>[#3]</b> 4zax > 00:23:972<br>
              <b>[#4]</b> saon777 > 06:01:471 <b>←???</b> 
            </p>
          </div>
        </details>

        <details class="toggle-container has-bg" style="--bg-image-url: url('athletic_diamond_bg.png');">
          <summary class="toggle-header">タイムアタック記録 [ダイヤ]</summary>
          <div class="toggle-content">
            <p>
              <b>[#1]</b> n73e > 00:55:308<br>
              <b>[#2]</b> Carubi_204483 > 00:57:604<br>
              <b>[#3]</b> enteralmimi > 01:08:981<br>
              <b>[#4]</b> 4zax > 01:12:870 
            </p>
          </div>
        </details>

        <h3>オーバーワールド</h3>
        
      `
    };

    document.getElementById("pageTitle").textContent = CONFIG.title;
    document.getElementById("category").textContent = CONFIG.category;
    document.getElementById("title").textContent = CONFIG.title;
    document.getElementById("subtitle").textContent = CONFIG.subtitle;
    document.getElementById("date").textContent = CONFIG.date;
    document.getElementById("authorName").textContent = CONFIG.authorName;
    
    const avatarEl = document.getElementById("authorAvatar");
    if (CONFIG.authorAvatar) {
      avatarEl.src = CONFIG.authorAvatar;
    } else {
      avatarEl.style.display = "none";
    }

    const eyecatchEl = document.getElementById("eyecatchImage");
    if (CONFIG.eyecatchImage) {
      eyecatchEl.src = CONFIG.eyecatchImage;
    } else {
      document.getElementById("eyecatchWrapper").style.display = "none";
    }

    document.getElementById("bodyContent").innerHTML = CONFIG.bodyHtml;

    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const menuOverlay = document.getElementById("menuOverlay");

    function setMenu(open) {
      menu.classList.toggle("open", open);
      menuOverlay.classList.toggle("open", open);
      menuButton.setAttribute("aria-expanded", open);
      menuButton.innerHTML = open ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-bars"></i>';
    }

    menuButton.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
    menuOverlay.addEventListener("click", () => setMenu(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });
  </script>

</body>
</html>
