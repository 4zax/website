<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <title>Projects - Azax's Website</title>

  <style>
    :root {
      --bg-default: #0d1117;
      --bg-subtle: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --cyan: #00ffff;
      --red: #ff0000;
    }

    body {
      background-color: var(--bg-default);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 32px;
    }

    .title {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--cyan);
      margin: 0 0 32px 0;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .message {
      margin: 0;
    }

    .project-card {
      background-color: var(--bg-default);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 14px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .project-card:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .project-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--cyan);
      font-size: 20px;
      flex-shrink: 0;
    }

    .project-info {
      min-width: 0;
    }

    .project-name {
      margin: 0;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: bold;
      word-break: break-word;
    }

    .project-type {
      margin: 2px 0 0 0;
      color: #8b949e;
      font-size: 0.85rem;
    }

    .audio-progress {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .audio-progress span {
      min-width: 36px;
      color: #8b949e;
      font-size: 0.8rem;
      font-family: "Consolas", "Courier New", monospace;
    }

    .audio-progress span:last-child {
      text-align: right;
    }

    .audio-progress input {
      flex: 1;
      height: 4px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .project-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .project-controls button,
    .project-controls a {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .project-controls button:hover,
    .project-controls a:hover {
      color: var(--cyan);
      border-color: var(--cyan);
      background-color: var(--bg-default);
    }

    .menu-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1001;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-subtle);
      color: var(--text-main);
      cursor: pointer;
      font-size: 22px;
    }

    .menu-button:hover {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      z-index: 999;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: min(300px, 80vw);
      height: 100vh;
      box-sizing: border-box;
      padding: 90px 24px 24px;
      background: var(--bg-subtle);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 1000;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu-title {
      color: var(--cyan);
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .menu a {
      display: block;
      padding: 12px 10px;
      margin-bottom: 6px;
      color: var(--text-main);
      text-decoration: none;
      border-radius: 6px;
    }

    .menu a:hover {
      color: var(--cyan);
      background: var(--bg-default);
    }
  </style>
</head>

<body>

  <button
    class="menu-button"
    id="menuButton"
    aria-label="メニューを開く"
    aria-expanded="false"
  >
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="menu-overlay" id="menuOverlay"></div>

  <nav class="menu" id="menu" aria-label="サイトメニュー">
    <div class="menu-title">Menu</div>

    <a href="/">
      <i class="fa-solid fa-house"></i> HOME
    </a>

    <a href="/friends">
      <i class="fa-solid fa-face-smile"></i> Friends
    </a>

    <a href="/projects">
      <i class="fa-solid fa-folder-open"></i> <b>Projects</b>
    </a>
  </nav>

  <div class="container">

    <h1 class="title">Projects</h1>

    <hr>

    <p class="message">
      ここでは、Azaxが作った作品を展示します。
    </p>

    <hr>

    <div class="project-card">

      <div class="project-header">

        <div class="project-icon">
          <i class="fa-solid fa-music"></i>
        </div>

        <div class="project-info">
          <h2 class="project-name">test.mp3</h2>
          <p class="project-type">Audio</p>
        </div>

      </div>

      <audio id="testAudio" src="/media/test.mp3"></audio>

      <div class="audio-progress">

        <span id="currentTime">0:00</span>

        <input
          type="range"
          id="progress"
          min="0"
          max="100"
          value="0"
        >

        <span id="duration">0:00</span>

      </div>

      <div class="project-controls">

        <button id="playButton">
          <i class="fa-solid fa-play"></i>
          再生
        </button>

        <button id="stopButton">
          <i class="fa-solid fa-stop"></i>
          停止
        </button>

        <a href="/media/test.mp3" download>
          <i class="fa-solid fa-download"></i>
          Download
        </a>

      </div>

    </div>

  </div>

  <script>
    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const menuOverlay = document.getElementById("menuOverlay");

    function setMenu(open) {
      menu.classList.toggle("open", open);
      menuOverlay.classList.toggle("open", open);

      menuButton.setAttribute("aria-expanded", open);

      menuButton.innerHTML = open
        ? '<i class="fa-solid fa-xmark"></i>'
        : '<i class="fa-solid fa-bars"></i>';
    }

    menuButton.addEventListener("click", () => {
      setMenu(!menu.classList.contains("open"));
    });

    menuOverlay.addEventListener("click", () => {
      setMenu(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setMenu(false);
      }
    });

    const testAudio = document.getElementById("testAudio");
    const playButton = document.getElementById("playButton");
    const stopButton = document.getElementById("stopButton");
    const progress = document.getElementById("progress");
    const currentTime = document.getElementById("currentTime");
    const duration = document.getElementById("duration");

    function formatTime(time) {
      if (isNaN(time)) {
        return "0:00";
      }

      const minutes = Math.floor(time / 60);

      const seconds = Math.floor(time % 60)
        .toString()
        .padStart(2, "0");

      return `${minutes}:${seconds}`;
    }

    playButton.addEventListener("click", () => {
      testAudio.play();
    });

    stopButton.addEventListener("click", () => {
      testAudio.pause();
      testAudio.currentTime = 0;

      progress.value = 0;
      currentTime.textContent = "0:00";
    });

    testAudio.addEventListener("loadedmetadata", () => {
      duration.textContent = formatTime(testAudio.duration);
    });

    testAudio.addEventListener("timeupdate", () => {
      if (!testAudio.duration) {
        return;
      }

      progress.value =
        (testAudio.currentTime / testAudio.duration) * 100;

      currentTime.textContent =
        formatTime(testAudio.currentTime);
    });

    progress.addEventListener("input", () => {
      if (!testAudio.duration) {
        return;
      }

      testAudio.currentTime =
        (progress.value / 100) * testAudio.duration;
    });

    testAudio.addEventListener("ended", () => {
      progress.value = 0;
      currentTime.textContent = "0:00";
    });
  </script>

</body>
</html>
